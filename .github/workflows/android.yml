
name: Echoes Android CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: echoes-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Echoes APK
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Install Android SDK packages
        run: |
          sdkmanager --install \
            "platforms;android-36" \
            "platforms;android-36-ext1" \
            "build-tools;36.0.0"

      - name: Verify Gradle wrapper
        shell: bash
        run: |
          if [ ! -f gradlew ]; then
            echo "::error::gradlew is missing from the repository root."
            exit 1
          fi

          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            echo "::error::Gradle wrapper JAR is missing."
            exit 1
          fi

          chmod +x gradlew
          java -version
          ./gradlew --version

      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug --stacktrace

      - name: Upload debug APK
        if: always() && hashFiles('app/build/outputs/apk/debug/app-debug.apk') != ''
        uses: actions/upload-artifact@v4
        with:
          name: Echoes-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
